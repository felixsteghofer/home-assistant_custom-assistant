name: Package, tests and secrets
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests
      - run: python scripts/validate_package.py
      - name: Scan files and complete history for secrets
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir=$(mktemp -d)
          release=https://github.com/gitleaks/gitleaks/releases/download/v8.30.1
          curl --fail --silent --show-error --location "$release/gitleaks_8.30.1_linux_x64.tar.gz" -o "$scanner_dir/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location "$release/gitleaks_8.30.1_checksums.txt" -o "$scanner_dir/checksums.txt"
          cd "$scanner_dir"
          awk '$2 == "gitleaks_8.30.1_linux_x64.tar.gz"' checksums.txt | sha256sum --check --strict
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$scanner_dir/gitleaks" dir . --redact
          "$scanner_dir/gitleaks" git . --log-opts="--all" --redact
